version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.3
    container_name: evolution_api_afiliado
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=afiliado-auto-secret-key-2026
      - AUTHENTICATION_EXPOSE_IN_SWAGGER=true
      - DATABASE_ENABLED=false
      - REDIS_ENABLED=false
      - LOG_LEVEL=ERROR,WARN,INFO
      - WEBSOCKET_ENABLED=false
      - CONFIG_SESSION_PHONE_CLIENT=AfiliadoAuto
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#16A36A
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
    name: evolution_instances
